<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone 15 · Sunoo’s Phone</title>
<style>
:root{--ios:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;--red:#ff453a;--blue:#0a84ff;--cell:#1c1c1e;--sep:#38383a;--dim:#8e8e93;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:radial-gradient(ellipse at 50% 30%,#111827,#030712 70%);font-family:var(--ios);color:#fff;overflow:hidden}
body{display:grid;place-items:center}
.wrap{width:414px;height:868px;flex:none;transform-origin:center}
.phone{position:relative;width:100%;height:100%;border-radius:54px;background:#000;box-shadow:0 0 0 3px #27272a,0 0 0 8px #09090b,0 0 90px rgba(59,130,246,.15),0 30px 80px #000}
.phone.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-5px,2px) rotate(-.6deg)}40%{transform:translate(5px,-2px) rotate(.6deg)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,-1px)}}
.btn{position:absolute;width:5px;background:#2a2a2d;border-radius:3px}
.b1{left:-9px;top:130px;height:30px}.b2{left:-9px;top:190px;height:58px}.b3{left:-9px;top:260px;height:58px}
.pw{right:-9px;top:210px;height:92px;cursor:pointer}
.screen{position:absolute;inset:12px;border-radius:44px;overflow:hidden;background:#000;isolation:isolate}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:110px;height:28px;background:#000;border-radius:14px;z-index:90;display:flex;align-items:center;justify-content:flex-end;padding-right:10px}
.notch::before{content:"";position:absolute;left:14px;top:9px;width:10px;height:10px;border-radius:50%;background:#0a0a12;box-shadow:inset 0 0 3px #112}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:80;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0 32px;font-weight:600;font-size:14px;pointer-events:none;letter-spacing:-.2px}
.status .r{display:flex;gap:6px;align-items:center}
.bat{width:24px;height:11px;border:1.5px solid #fff;border-radius:3px;padding:1px;position:relative}
.bat::after{content:"";position:absolute;right:-3px;top:2.5px;width:1.5px;height:4px;background:#fff;border-radius:0 1px 1px 0}
.bat i{display:block;height:100%;width:85%;background:#fff;border-radius:1px}
.wall{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80') center/cover no-repeat;filter:brightness(.65)}
.wall::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.3),rgba(0,0,0,0.7));}
.home{position:absolute;inset:0;z-index:10;padding:64px 20px 0;transition:transform .45s cubic-bezier(.32,.72,0,1),opacity .45s,filter .45s}
.home.away{transform:scale(.9);opacity:.4;filter:blur(3px)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 0;justify-items:center}
.ap{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:400;text-shadow:0 1px 4px #000c;cursor:pointer;transition:transform .15s}
.ap:active{transform:scale(.88)}
.icon{width:60px;height:60px;border-radius:14px;box-shadow:0 4px 12px #0006;overflow:hidden}
.dock{position:absolute;left:12px;right:12px;bottom:20px;height:92px;border-radius:32px;background:rgba(255,255,255,.15);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:flex;justify-content:space-around;align-items:center;padding:0 8px;border:1px solid rgba(255,255,255,.1)}
.dock .ap span{display:none}
.hbar{position:absolute;bottom:6px;left:50%;margin-left:-68px;width:136px;height:18px;z-index:95;cursor:pointer}
.hbar::after{content:"";position:absolute;left:0;bottom:6px;width:136px;height:4px;border-radius:2px;background:#fff}
.app{position:absolute;inset:0;z-index:50;background:#000;transform:scale(.14);opacity:0;border-radius:44px;overflow:hidden;transition:transform .45s cubic-bezier(.32,.72,0,1),opacity .3s,border-radius .45s;display:flex;flex-direction:column}
.app.on{transform:none;opacity:1;border-radius:0}
.bar{padding:52px 16px 8px;flex:none}
.bar h1{margin:6px 0 0;font-size:32px;font-weight:700;letter-spacing:-.5px}
.body{flex:1;overflow:auto;padding:0 16px 40px}
.cells{background:var(--cell);border-radius:12px;overflow:hidden;margin-bottom:20px}
.cell{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:.5px solid var(--sep);font-size:17px;min-height:46px}
.cell:last-child{border:0}.cell .sub{margin-left:auto;color:var(--dim);font-size:15px;text-align:right}
.cell .si{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;font-size:16px;flex:none}
.sw{margin-left:auto;width:51px;height:31px;border-radius:16px;background:#39393d;position:relative;transition:background .25s;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0006;transition:transform .25s cubic-bezier(.32,.72,0,1)}
.sw.on{background:#30d158}.sw.on::after{transform:translateX(20px)}
.chat{flex:1;overflow:auto;padding:8px 14px;display:flex;flex-direction:column;gap:8px}
.chead{padding:48px 0 8px;text-align:center;background:rgba(28,28,30,.8);backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep);flex:none}
.av{width:44px;height:44px;border-radius:50%;margin:0 auto 4px;background:#3a3a3c;background-size:cover;display:grid;place-items:center;font-size:18px;font-weight:600;color:#fff}
.chead small{font-size:12px;color:var(--dim)}
.bub{max-width:78%;padding:8px 13px;border-radius:19px;font-size:16px;line-height:1.3;animation:pop .3s cubic-bezier(.32,.72,0,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.bub.in{background:#26262a;align-self:flex-start;border-bottom-left-radius:5px}
.bub.out{background:#0a84ff;align-self:flex-end;border-bottom-right-radius:5px}
.typing{align-self:flex-start;background:#26262a;border-radius:19px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#8e8e93;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{30%{transform:translateY(-4px);opacity:.4}}
.chips{display:flex;gap:8px;overflow:auto;padding:8px 12px 4px;flex:none}
.chip{flex:none;border:1px solid #0a84ff;color:#0a84ff;border-radius:16px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip:active{background:rgba(10,132,255,.2)}
.inp{display:flex;gap:8px;padding:6px 12px 30px;flex:none}
.inp input{flex:1;background:#1c1c1e;border:1px solid var(--sep);color:#fff;border-radius:18px;padding:8px 14px;font:16px var(--ios);outline:0}
.inp button{width:34px;height:34px;border-radius:50%;border:0;background:#0a84ff;color:#fff;font-size:18px;cursor:pointer}
.lock{position:absolute;inset:0;z-index:40;transition:transform .55s cubic-bezier(.32,.72,0,1);touch-action:none;display:flex;flex-direction:column;align-items:center;padding-top:54px}
.lock.up{transform:translateY(-100%)!important}
.date{font-size:18px;font-weight:500;opacity:.85;margin-top:6px}
.time{font-size:82px;font-weight:600;letter-spacing:-2px;color:#fff;margin-top:2px;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.notif{margin-top:auto;margin-bottom:50px;width:calc(100% - 24px);padding:14px 16px;border-radius:20px;background:rgba(44,44,46,.75);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.notif b{font-size:14px;display:block}.notif p{margin:2px 0 0;font-size:13px;color:#d1d1d6}
.ico{width:38px;height:38px;border-radius:10px;flex:none;overflow:hidden}
.ico svg{width:100%;height:100%}
.swipe{position:absolute;bottom:20px;width:100%;text-align:center;font-size:14px;color:rgba(255,255,255,.7)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{aspect-ratio:1;background:#1c1c1e;position:relative;cursor:pointer;overflow:hidden;background-size:cover;background-position:center}
.note{font-size:16px;line-height:1.6;white-space:pre-wrap;padding-top:6px;color:#f2f2f7}
.banner{position:absolute;left:12px;right:12px;top:-110px;z-index:100;padding:12px 14px;border-radius:20px;background:rgba(44,44,46,.9);backdrop-filter:blur(30px);display:flex;gap:12px;align-items:center;transition:transform .5s cubic-bezier(.32,.72,0,1);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.banner.show{transform:translateY(166px)}
.banner b{font-size:14px}.banner p{margin:2px 0 0;font-size:13px;color:#d1d1d6}
.pass{position:absolute;inset:0;z-index:39;background:rgba(0,0,2,0.65);backdrop-filter:blur(30px);opacity:0;pointer-events:none;transition:opacity .35s;display:flex;flex-direction:column;align-items:center;padding-top:90px}
.pass.show{opacity:1;pointer-events:auto}
.ptt{font-size:19px;font-weight:400;margin:14px 0 20px;text-align:center}
.dots{display:flex;gap:16px;margin-bottom:44px}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;transition:background .1s}.dot.f{background:#fff}
.ppad{display:grid;grid-template-columns:repeat(3,75px);gap:14px 20px}
.pk{height:75px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;font-weight:300;cursor:pointer;transition:background .1s}
.pk:active{background:rgba(255,255,255,.3)}
.pk small{font-size:9px;letter-spacing:2px;font-weight:600;margin-top:-2px}
.pbot{display:flex;justify-content:space-between;width:100%;padding:0 52px;margin-top:24px;font-size:16px;color:var(--blue)}
.pv{position:absolute;inset:0;background:#000;z-index:6;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .4s cubic-bezier(.32,.72,0,1)}
.pv.on{transform:none}
.pvt{padding:52px 14px 10px;display:flex;justify-content:space-between;align-items:center;font-size:15px;flex:none}
.pvt span{color:var(--blue);font-size:17px;cursor:pointer}
.pvi{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.pvi img{max-width:100%;max-height:100%;object-fit:contain}
.pvbar{height:84px;display:flex;justify-content:space-around;align-items:center;font-size:22px;color:var(--blue);flex:none;background:rgba(28,28,30,.8);backdrop-filter:blur(20px)}
</style></head>
<body>
<div class="wrap" id="wrap"><div class="phone" id="phone">
<div class="btn b1"></div><div class="btn b2"></div><div class="btn b3"></div><div class="btn pw" id="pw" title="Side button"></div>
<div class="screen" id="screen">
<div class="notch"></div>
<div class="status"><span id="sbt">9:41</span><span class="r"><svg width="17" height="12" viewBox="0 0 18 12" fill="#fff"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" width="3" height="12" rx="1" opacity=".4"/></svg><svg width="16" height="12" viewBox="0 0 17 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M1 4a11 11 0 0115 0M4 7a7 7 0 019 0"/><circle cx="8.5" cy="10" r="1" fill="#fff"/></svg><span class="bat"><i></i></span></span></div>
<div class="wall"></div>

<div class="home" id="home">
<div class="grid" id="grid"></div>
<div class="dock" id="dock"></div></div>

<div class="lock" id="lock">
<svg width="18" height="24" viewBox="0 0 16 22" fill="#fff" style="margin-bottom:6px"><rect y="9" width="16" height="13" rx="3"/><path d="M3.5 10V6a4.5 4.5 0 019 0v4" fill="none" stroke="#fff" stroke-width="2"/></svg>
<div class="date" id="ldate"></div><div class="time" id="ltime">9:41</div>
<div class="notif" id="notif"><div class="ico" id="nico"></div><div><b>Messages</b><p>Mom: Did you eat dinner at the library, Sunoo?</p></div></div>
<div class="swipe">Swipe up to unlock</div></div>

<div class="pass" id="pass">
<svg width="16" height="22" viewBox="0 0 16 22" fill="#fff"><rect y="9" width="16" height="13" rx="3"/><path d="M3.5 10V6a4.5 4.5 0 019 0v4" fill="none" stroke="#fff" stroke-width="2"/></svg>
<div class="ptt" id="ptt">Enter Passcode</div>
<div class="dots" id="pdots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
<div class="ppad" id="ppad"></div>
<div class="pbot"><span id="pem">Emergency</span><span id="pcancel">Cancel</span></div>
</div>

<div class="banner" id="bnr"><div class="ico" id="bico"></div><div><b id="bt"></b><p id="bm"></p></div></div>
<div class="hbar" id="hbar"></div>
</div></div></div>

<script>
// Public Library & College Lonely Aesthetic Photos (Sunoo-inspired mood / Public Library study sessions)
const SUNOO_PHOTOS = [
  'https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=800&q=80', // Library study desk alone at night
  'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=800&q=80', // Empty rows of books
  'https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=800&q=80', // Solitary student reading
  'https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=800&q=80', // College campus walkway at dusk
  'https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=800&q=80', // Quiet reading lamp
  'https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?auto=format&fit=crop&w=800&q=80'  // Coffee cup and notebook alone
];

const $=s=>document.querySelector(s);
const IC={
messages:['#30d158','#0cbd2a','Messages','<path d="M30 12c-11 0-20 7-20 16 0 5 3 9 7 12-1 3-3 5-5 7 5 0 8-2 10-3 2 .5 5 1 8 1 11 0 20-7 20-16s-9-17-20-17z" fill="#fff"/>'],
notes:['#fed84f','#fbbf24','Notes','<rect x="12" y="16" width="36" height="34" rx="4" fill="#fff"/><path d="M18 26h24M18 33h24M18 40h16" stroke="#c8c8cc" stroke-width="2.5"/>'],
photos:['#fff','#f2f2f7','Photos','<rect x="12" y="12" width="36" height="36" rx="8" fill="#0a84ff"/><circle cx="30" cy="27" r="8" fill="#fff"/><circle cx="40" cy="20" r="3" fill="#fff"/>'],
mail:['#4fb2ff','#0a6cf0','Mail','<rect x="11" y="16" width="38" height="28" rx="4" fill="#fff"/><path d="M12 18l18 14 18-14" fill="none" stroke="#2b7de9" stroke-width="2.5"/>'],
calendar:['#fff','#f2f2f7','Calendar','<text x="30" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#ff3b30" font-family="-apple-system">WED</text><text x="30" y="46" text-anchor="middle" font-size="28" font-weight="300" fill="#111" font-family="-apple-system">21</text>'],
reminders:['#0a84ff','#0056b3','Reminders','<circle cx="18" cy="20" r="4" fill="#ff3b30"/><rect x="26" y="17" width="22" height="6" rx="3" fill="#fff"/><circle cx="18" cy="35" r="4" fill="#30d158"/><rect x="26" y="32" width="22" height="6" rx="3" fill="#fff"/><circle cx="18" cy="50" r="4" fill="#ff9f0a"/><rect x="26" y="47" width="16" height="6" rx="3" fill="#fff"/>'],
canvas:['#e11d48','#be123c','Canvas','<path d="M30 10L10 20v20l20 10 20-10V20z" fill="#fff"/><path d="M30 30L10 20m20 10l20-10m-20 10v20" stroke="#be123c" stroke-width="3"/>'],
music:['#ff6b81','#f01a3e','Music','<path d="M26 17l18-4v26a6 6 0 11-3-5V21l-12 3v19a6 6 0 11-3-5z" fill="#fff"/>'],
clock:['#000','#1c1c1e','Clock','<circle cx="30" cy="30" r="24" fill="#fff"/><path d="M30 14v16l10 6" stroke="#000" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M30 30L44 14" stroke="#ff9f0a" stroke-width="2"/>'],
maps:['#7ee08a','#3aa655','Maps','<path d="M30 12c-8 0-13 6-13 13 0 9 13 23 13 23s13-14 13-23c0-7-5-13-13-13z" fill="#ff3b30"/><circle cx="30" cy="25" r="5" fill="#fff"/>'],
health:['#fff','#f2f2f7','Health','<path d="M30 46C14 34 12 24 18 19s12-2 12 4c0-6 7-9 12-4s4 15-12 27z" fill="#ff2d55"/>'],
settings:['#a2a2a8','#6e6e73','Settings','<circle cx="30" cy="30" r="14" fill="none" stroke="#e5e5ea" stroke-width="6"/><circle cx="30" cy="30" r="19" fill="none" stroke="#e5e5ea" stroke-width="7" stroke-dasharray="5 9.9"/>'],
phone:['#5bf675','#0cbd2a','Phone','<path d="M17 13c-3 2-4 5-3 9 3 12 13 22 25 25 4 1 7 0 9-3l1-2-8-6-4 3c-5-2-9-6-11-11l3-4-6-8z" fill="#fff"/>'],
safari:['#fff','#e8e8ee','Safari','<circle cx="30" cy="30" r="22" fill="none" stroke="#0a84ff" stroke-width="3"/><path d="M40 20L34 34 20 40l6-14z" fill="#ff3b30"/>'],
health:['#fff','#f2f2f7','Health','<path d="M30 46C14 34 12 24 18 19s12-2 12 4c0-6 7-9 12-4s4 15-12 27z" fill="#ff2d55"/>'],
wallet:['#000','#1c1c1e','Wallet','<rect x="10" y="16" width="40" height="9" rx="3" fill="#ff9f0a"/><rect x="10" y="22" width="40" height="9" rx="3" fill="#30d158"/><rect x="10" y="28" width="40" height="9" rx="3" fill="#0a84ff"/>']
};
const svg=id=>{const[a,b,,s]=IC[id];return `<svg viewBox="0 0 60 60"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="60" height="60" fill="url(#g${id})"/>${s}</svg>`};

const S=()=>+wrap.dataset.s||1;
let cur=null,locked=true;
function fit(){const s=Math.min(1,(innerHeight-16)/868,(innerWidth-16)/414);wrap.dataset.s=s;wrap.style.transform=`scale(${s})`;wrap.style.margin=`${(868*s-868)/2}px ${(414*s-414)/2}px`}
addEventListener('resize',fit);fit();

function mk(id){return `<div class="ap" data-id="${id}"><div class="icon">${svg(id)}</div><span>${IC[id][2]}</span></div>`}
grid.innerHTML=['notes','photos','mail','calendar','reminders','canvas','music','clock','maps','health','settings','wallet'].map(mk).join('');
dock.innerHTML=['phone','safari','messages','camera'.replace('camera','music')].map(mk).join('');
nico.innerHTML=svg('messages');

function banner(id,t,m){bico.innerHTML=svg(id);bt.textContent=t;bm.textContent=m;$('#bnr').classList.add('show');phone.classList.remove('shake');void phone.offsetWidth;phone.classList.add('shake');clearTimeout(bt2);bt2=setTimeout(()=>$('#bnr').classList.remove('show'),3500)}let bt2;

document.addEventListener('click',e=>{const a=e.target.closest('.ap');if(!a||cur||locked)return;const id=a.dataset.id;openApp(id,a.querySelector('.icon'))});

function openApp(id,el){const r=el.getBoundingClientRect(),s=$('#screen').getBoundingClientRect(),k=S();
const a=document.createElement('div');a.className='app';a.style.transformOrigin=`${(r.left+r.width/2-s.left)/k}px ${(r.top+r.height/2-s.top)/k}px`;
a.innerHTML=APPS[id].html();$('#screen').appendChild(a);void a.offsetWidth;a.classList.add('on');home.classList.add('away');cur=a;APPS[id].init&&APPS[id].init(a)}

function closeApp(){if(!cur)return;const a=cur;cur=null;a.classList.remove('on');home.classList.remove('away');a._stop&&a._stop();setTimeout(()=>a.remove(),450)}

hbar.onclick=()=>{if(locked){if(!ps.classList.contains('show'))unlock()}else closeApp()};
$('#pw').onclick=()=>{closeApp();locked=true;ps.classList.remove('show');lock.classList.remove('up');lock.style.transform=''};

// lock swipe
let y0=null,dy=0;
lock.onpointerdown=e=>{y0=e.clientY;dy=0;lock.style.transition='none';lock.setPointerCapture(e.pointerId)};
lock.onpointermove=e=>{if(y0==null)return;dy=Math.min(0,(e.clientY-y0)/S());lock.style.transform=`translateY(${dy}px)`};
lock.onpointerup=()=>{if(y0==null)return;y0=null;lock.style.transition='';if(dy<-120)unlock();else lock.style.transform=''};
function unlock(){lock.style.transform='';lock.classList.add('up');showPass()}

const ps=$('#pass'),pd=$('#pdots');let code='';
$('#ppad').innerHTML=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],0,['0',''],0].map(k=>k?`<div class="pk" data-n="${k[0]}">${k[0]}<small>${k[1]}</small></div>`:'<div></div>').join('');
function draw(){pd.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('f',i<code.length));$('#pcancel').textContent=code?'Delete':'Cancel'}
function showPass(){code='';draw();$('#ptt').textContent='Enter Passcode';ps.classList.add('show')}
ps.querySelectorAll('.pk[data-n]').forEach(k=>k.onclick=()=>{if(code.length>=4)return;code+=k.dataset.n;draw();if(code.length===4)setTimeout(check,150)});
$('#pcancel').onclick=()=>{if(code){code=code.slice(0,-1);draw()}else{ps.classList.remove('show');lock.classList.remove('up')}};
$('#pem').onclick=()=>banner('phone','Emergency','No emergency contacts saved.');
function ok(){ps.classList.remove('show');locked=false}
function check(){if(code==='2026')return ok();pd.classList.add('sh');setTimeout(()=>pd.classList.remove('sh'),400);$('#ptt').textContent='Incorrect passcode (Hint: graduation year or 2026)';code='';setTimeout(draw,500)}

function tick(){const d=new Date();let h=d.getHours()%12||12,m=String(d.getMinutes()).padStart(2,'0');let t=h+':'+m;sbt.textContent=t;ltime.textContent=t;
ldate.textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}
tick();setInterval(tick,5000);

11:42 PM

Another night sitting alone at the corner table of the public library because my dorm room feels too small and suffocating. 

Everyone in my college classes already formed their friend groups during freshman orientation. I tried joining the debate club and the film society, but I always end up standing awkwardly by the snack table until I just leave.
